---
# Re-registers the Telegram webhook. Manual and optional — a normal
# deploy re-installs the same URL, so this is only for when it actually
# changes (first install, secret rotation, CADDY_DOMAIN change). Secrets
# are read from the server's own .env — see ansible/README.md.
- name: Prepare SSH transport for the webhook job
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - prepare_connection

- name: Re-register the Telegram webhook
  hosts: production
  become: true
  become_user: "{{ app_user }}"
  gather_facts: false
  serial: 1
  roles:
    - register_webhook

- name: Remove controller SSH credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Clean up the prepared SSH transport
      ansible.builtin.include_role:
        name: prepare_connection
        tasks_from: cleanup
