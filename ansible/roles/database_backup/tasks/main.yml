---
# Runs from application_deploy, immediately after configuration_backup and
# before anything about the running release changes — a failed backup here
# stops the deploy exactly the same way a failed configuration backup does
# (see application_deploy/tasks/main.yml's outer rescue/always). Skipped
# only when there's genuinely no database to back up yet (a first install —
# application_deploy_previous_raw, set by the caller, only succeeds once a
# previous deployment.json exists) or when explicitly disabled.
- name: Skip database backup (disabled, or no previous release to back up)
  ansible.builtin.debug:
    msg: >-
      Database backup skipped:
      {{ 'disabled via DB_BACKUP_ENABLED' if not db_backup_enabled else 'no previous release (first install)' }}
  when: not db_backup_enabled or not (application_deploy_previous_raw is succeeded)

- name: Back up the database before deploying
  when: db_backup_enabled and (application_deploy_previous_raw is succeeded)
  block:
    - name: Allocate a private staging directory for the dump
      ansible.builtin.tempfile:
        state: directory
        prefix: cs2predictor-db-backup-
      register: db_backup_staging

    - name: Fix the backup label for this run
      # db_backup_label's default embeds lookup('pipe', 'date ...'), which
      # re-runs on every dereference — without pinning it to a fact here,
      # the dump/gzip/move/upload tasks below would each compute a
      # different timestamp and never agree on one filename.
      ansible.builtin.set_fact:
        db_backup_label: "{{ db_backup_label }}"

    - name: Dump the database to a compressed custom-format file
      # -Fc (custom format) is pg_restore-ready and already compressed by
      # pg_dump itself at its default level; the extra gzip pass below is
      # for the filename/transport convention (a plain .gz any tool can
      # decompress), not because -Fc needs it.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          {{ (compose_argv + ['exec', '-T', db_backup_container_service, 'pg_dump', '-U', db_backup_database_user, '-Fc', db_backup_database_name]) | map('quote') | join(' ') }}
          > {{ db_backup_staging.path | quote }}/{{ db_backup_label }}.dump
        executable: /bin/bash
      environment:
        # compose.prod.yml's bot service is `image: ${APP_IMAGE:?required}`
        # — Compose refuses to interpolate the file at all without it, even
        # for a read-only `exec` into the already-running previous release
        # (this task runs before "Pull and install the release" below,
        # which is the only other place APP_IMAGE gets set). The actual
        # value doesn't matter for `exec` — it never resolves an image to
        # start — so the previous release's own recorded image is enough;
        # application_deploy_previous_image is only set when a previous
        # release recorded one (see application_deploy/tasks/main.yml), so
        # this falls back to the release being installed now for the one
        # edge case that survives database_backup's own "not a first
        # install" guard without it (an older deployment.json missing the
        # image field).
        APP_IMAGE: "{{ application_deploy_previous_image | default(app_image) }}"
      changed_when: true

    - name: Compress the dump
      ansible.builtin.command:
        argv: [gzip, "{{ db_backup_staging.path }}/{{ db_backup_label }}.dump"]
      changed_when: true

    - name: Determine the compressed dump's size
      # Read by "Record the backup in db_backup_log" below — taken here,
      # before the fs/s3 branches, since neither a filesystem move nor an
      # S3 upload changes the file's own size.
      ansible.builtin.stat:
        path: "{{ db_backup_staging.path }}/{{ db_backup_label }}.dump.gz"
      register: db_backup_dump_stat

    - name: Store the compressed dump on the filesystem
      when: db_backup_storage == 'fs'
      block:
        - name: Create the filesystem backup root
          ansible.builtin.file:
            path: "{{ db_backup_fs_root }}"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0700'

        - name: Move the dump into the backup root
          ansible.builtin.copy:
            src: "{{ db_backup_staging.path }}/{{ db_backup_label }}.dump.gz"
            dest: "{{ db_backup_fs_root }}/{{ db_backup_label }}.dump.gz"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: '0600'
            remote_src: true

        - name: Prune filesystem backups older than the retention window
          ansible.builtin.shell:
            cmd: "find {{ db_backup_fs_root | quote }} -maxdepth 1 -name '*.dump.gz' -mtime +{{ db_backup_retention_days }} -delete"
            executable: /bin/bash
          changed_when: false

    - name: Upload the compressed dump to S3-compatible storage
      when: db_backup_storage == 's3'
      block:
        - name: Require S3 configuration
          ansible.builtin.assert:
            that:
              - db_backup_s3_bucket | length > 0
              - lookup('env', 'DB_BACKUP_S3_ACCESS_KEY_ID') | length > 0
              - lookup('env', 'DB_BACKUP_S3_SECRET_ACCESS_KEY') | length > 0
            fail_msg: >-
              Set DB_BACKUP_S3_BUCKET, DB_BACKUP_S3_ACCESS_KEY_ID and DB_BACKUP_S3_SECRET_ACCESS_KEY to back up to S3
              (see ansible/README.md).

        # Run through the official AWS CLI image rather than a host-
        # installed `aws` binary: neither this role nor any other ever
        # installed one (a real incident — the two tasks below assumed it
        # was already on the host and failed with a bare "command not
        # found", hidden by no_log so it looked like a credentials/
        # permission problem instead), and the deploy user has no sudo/apt
        # access to install system packages — only Docker, which every
        # other command in this role already relies on (compose_argv).
        # Pinned to a specific tag for the same reason every image this
        # project deploys is pinned: a re-run installs the exact bytes
        # that were verified, not whatever `latest` points to by then.
        - name: Ensure the bucket's lifecycle rule matches the configured retention
          # A declared lifecycle rule, not a manual prune loop: retention
          # holds even if a later deploy — the only thing that runs this
          # role — never happens again for a while. Re-applied every
          # deploy so a changed DB_BACKUP_RETENTION_DAYS actually takes
          # effect instead of only affecting backups uploaded after the
          # change.
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -e
              - AWS_ACCESS_KEY_ID
              - -e
              - AWS_SECRET_ACCESS_KEY
              - -e
              - AWS_DEFAULT_REGION
              - amazon/aws-cli:2.23.6
              - s3api
              - put-bucket-lifecycle-configuration
              - --endpoint-url
              - "{{ db_backup_s3_endpoint }}"
              - --bucket
              - "{{ db_backup_s3_bucket }}"
              - --lifecycle-configuration
              - "{{ {'Rules': [{'ID': 'cs2predictor-db-backup-retention', 'Status': 'Enabled', 'Filter': {'Prefix': db_backup_s3_prefix}, 'Expiration': {'Days': db_backup_retention_days | int}}]} | to_json }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ lookup('env', 'DB_BACKUP_S3_ACCESS_KEY_ID') }}"
            AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'DB_BACKUP_S3_SECRET_ACCESS_KEY') }}"
            AWS_DEFAULT_REGION: "{{ db_backup_s3_region }}"
          changed_when: true
          no_log: true

        - name: Upload the dump
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - -v
              - "{{ db_backup_staging.path }}:/data:ro"
              - -e
              - AWS_ACCESS_KEY_ID
              - -e
              - AWS_SECRET_ACCESS_KEY
              - -e
              - AWS_DEFAULT_REGION
              - amazon/aws-cli:2.23.6
              - s3
              - cp
              - "/data/{{ db_backup_label }}.dump.gz"
              - "s3://{{ db_backup_s3_bucket }}/{{ db_backup_s3_prefix }}{{ db_backup_label }}.dump.gz"
              - --endpoint-url
              - "{{ db_backup_s3_endpoint }}"
          environment:
            AWS_ACCESS_KEY_ID: "{{ lookup('env', 'DB_BACKUP_S3_ACCESS_KEY_ID') }}"
            AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'DB_BACKUP_S3_SECRET_ACCESS_KEY') }}"
            AWS_DEFAULT_REGION: "{{ db_backup_s3_region }}"
          changed_when: true
          no_log: true

    - name: Record the backup in db_backup_log
      # Read back by internal/adapter/telegram/backup_status.go (the admin
      # panel's backup-status screen) — this bot process never performs a
      # backup itself, so this INSERT is the only place that table's data
      # comes from. Only reached once pg_dump/compress/store-or-upload
      # above already succeeded (an earlier failure aborts the play before
      # this point), so there is nothing to record on a failed backup — see
      # db_backup_log's own migration comment for why that gap is
      # intentional rather than an oversight.
      ansible.builtin.shell:
        cmd: >-
          {{ (compose_argv + ['exec', '-T', db_backup_container_service, 'psql', '-U', db_backup_database_user, '-d', db_backup_database_name, '-c',
            "INSERT INTO db_backup_log(label, storage, size_bytes) VALUES ('" + db_backup_label + "', '" + db_backup_storage + "', " + (db_backup_dump_stat.stat.size | string) + ")"
          ]) | map('quote') | join(' ') }}
        executable: /bin/bash
      environment:
        # Same requirement as "Dump the database to a compressed
        # custom-format file" above, for the same reason — see that task's
        # own comment: Compose won't interpolate compose.prod.yml (and so
        # won't run `exec` into any service) without APP_IMAGE set, even
        # though this exec never starts the bot service itself.
        APP_IMAGE: "{{ application_deploy_previous_image | default(app_image) }}"
      changed_when: true

    - name: Report the backup outcome
      ansible.builtin.debug:
        msg: "Database backup complete: {{ db_backup_label }}.dump.gz ({{ db_backup_storage }})"
  always:
    - name: Remove the local staging directory
      ansible.builtin.file:
        path: "{{ db_backup_staging.path }}"
        state: absent
      when: db_backup_staging is defined and db_backup_staging.path is defined
