name: Deploy

# Manual deployment; automation is read from the protected default branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install, e.g. v1.2.3. It must already exist and have a published image.'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out trusted deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate the tag format
        run: make check-tag
        env:
          TAG: ${{ inputs.tag }}

      - name: Check out selected release configuration
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release
          persist-credentials: false
          sparse-checkout: docker

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # prepare_deploy shells out to cosign to verify the image's
      # signature — see ansible/README.md's "Image signing" section.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Prepare, back up and deploy with Ansible
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          CADDY_DOMAIN: ${{ vars.CADDY_DOMAIN }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make deploy

      - name: Notify the bot's administrators of the failed deploy
        # No-op unless the DEPLOY_NOTIFY_CHAT_IDS variable is set — see ansible/README.md.
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          NOTIFY_MESSAGE: "Деплой ${{ inputs.tag }} не выполнен: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_NOTIFY_CHAT_IDS: ${{ vars.DEPLOY_NOTIFY_CHAT_IDS }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make notify-deploy-failure

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
