name: Deploy

# Manual deployment; automation is read from the protected default branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install, e.g. v1.2.3. It must already exist and have a published image.'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out trusted deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate the tag format
        run: make check-tag
        env:
          TAG: ${{ inputs.tag }}

      - name: Check out selected release configuration
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release
          persist-credentials: false
          sparse-checkout: docker

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # prepare_deploy shells out to cosign to verify the image's
      # signature — see ansible/README.md's "Image signing" section.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Prepare, back up and deploy with Ansible
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          CADDY_DOMAIN: ${{ vars.CADDY_DOMAIN }}
          # Root /team_matches operators and deploy-failure DM recipients —
          # ansible's own .env template reads this exact variable
          # (application_deploy/tasks/main.yml), but it must also be set
          # here for that lookup to see anything: the separate "Notify the
          # bot's administrators" step below reads the same GitHub variable
          # directly and worked all along, which is what made this gap easy
          # to miss — that step never touches .env at all, it just proves
          # the GitHub variable itself is configured correctly.
          DEPLOY_NOTIFY_CHAT_IDS: ${{ vars.DEPLOY_NOTIFY_CHAT_IDS }}
          # Optional team-data enrichment — every one of these is safe to
          # leave undeclared in the environment: an unset vars/secrets
          # context resolves to an empty string here, ansible writes that
          # empty value into .env (see application_deploy's own defaulting),
          # and internal/app/config.go treats an empty value as "not
          # configured" rather than failing to start.
          VALVE_VRS_ENABLED: ${{ vars.VALVE_VRS_ENABLED }}
          VALVE_VRS_SYNC_INTERVAL: ${{ vars.VALVE_VRS_SYNC_INTERVAL }}
          GRID_ENABLED: ${{ vars.GRID_ENABLED }}
          GRID_API_KEY: ${{ secrets.GRID_API_KEY }}
          GRID_SYNC_INTERVAL: ${{ vars.GRID_SYNC_INTERVAL }}
          LIQUIPEDIA_ENABLED: ${{ vars.LIQUIPEDIA_ENABLED }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_SYNC_INTERVAL: ${{ vars.LIQUIPEDIA_SYNC_INTERVAL }}
          HLTV_ENABLED: ${{ vars.HLTV_ENABLED }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_RANKING_CHECK_INTERVAL: ${{ vars.APIFY_RANKING_CHECK_INTERVAL }}
          APIFY_MAX_TEAMS: ${{ vars.APIFY_MAX_TEAMS }}
          # Mandatory pre-deploy database backup (ansible/roles/database_backup) —
          # unlike the enrichment variables above, these are read by Ansible
          # itself (lookup('env', ...) in the role's defaults), not written
          # into the app's .env; every one is optional and defaults safely
          # (keep the newest 5, filesystem storage) — see ansible/README.md.
          DB_BACKUP_ENABLED: ${{ vars.DB_BACKUP_ENABLED }}
          DB_BACKUP_RETENTION_COUNT: ${{ vars.DB_BACKUP_RETENTION_COUNT }}
          DB_BACKUP_STORAGE: ${{ vars.DB_BACKUP_STORAGE }}
          DB_BACKUP_S3_ENDPOINT: ${{ vars.DB_BACKUP_S3_ENDPOINT }}
          DB_BACKUP_S3_REGION: ${{ vars.DB_BACKUP_S3_REGION }}
          DB_BACKUP_S3_BUCKET: ${{ vars.DB_BACKUP_S3_BUCKET }}
          DB_BACKUP_S3_PREFIX: ${{ vars.DB_BACKUP_S3_PREFIX }}
          DB_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.DB_BACKUP_S3_ACCESS_KEY_ID }}
          DB_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.DB_BACKUP_S3_SECRET_ACCESS_KEY }}
          EVENT_EVE_LEAD: ${{ vars.EVENT_EVE_LEAD }}
          DATABASE_POOL_SIZE: ${{ vars.DATABASE_POOL_SIZE }}
          # Optional: defaults to https://<CADDY_DOMAIN>/app/, where the
          # deploy installs the Mini App's own files.
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
          HOST_ALERT_MEMORY: ${{ vars.HOST_ALERT_MEMORY }}
          HOST_ALERT_DISK: ${{ vars.HOST_ALERT_DISK }}
          HOST_ALERT_LOAD_PER_CPU: ${{ vars.HOST_ALERT_LOAD_PER_CPU }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make deploy

      - name: Notify the bot's administrators of the failed deploy
        # No-op unless the DEPLOY_NOTIFY_CHAT_IDS variable is set — see ansible/README.md.
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          NOTIFY_MESSAGE: "Деплой ${{ inputs.tag }} не выполнен: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_NOTIFY_CHAT_IDS: ${{ vars.DEPLOY_NOTIFY_CHAT_IDS }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make notify-deploy-failure

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
