name: Backup

# Runs the database backup once a day, independent of any deploy — the
# mandatory pre-deploy backup in deploy.yml only protects against a
# *deploy*, so days without one would otherwise leave the accumulating
# votes/predictions unbacked. See ansible/backup.yml and ansible/README.md's
# "Scheduled backups" section.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backup:
    name: Back up the production database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out trusted deployment automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt

      - name: Back up the database
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          DB_BACKUP_ENABLED: ${{ vars.DB_BACKUP_ENABLED }}
          DB_BACKUP_RETENTION_COUNT: ${{ vars.DB_BACKUP_RETENTION_COUNT }}
          DB_BACKUP_STORAGE: ${{ vars.DB_BACKUP_STORAGE }}
          DB_BACKUP_S3_ENDPOINT: ${{ vars.DB_BACKUP_S3_ENDPOINT }}
          DB_BACKUP_S3_REGION: ${{ vars.DB_BACKUP_S3_REGION }}
          DB_BACKUP_S3_BUCKET: ${{ vars.DB_BACKUP_S3_BUCKET }}
          DB_BACKUP_S3_PREFIX: ${{ vars.DB_BACKUP_S3_PREFIX }}
          DB_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.DB_BACKUP_S3_ACCESS_KEY_ID }}
          DB_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.DB_BACKUP_S3_SECRET_ACCESS_KEY }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make backup

      - name: Notify the bot's administrators of the failed backup
        # No-op unless the DEPLOY_NOTIFY_CHAT_IDS variable is set — see ansible/README.md.
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_PATH: ${{ vars.APP_PATH }}
          NOTIFY_MESSAGE: "Плановый бэкап БД не выполнен: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_NOTIFY_CHAT_IDS: ${{ vars.DEPLOY_NOTIFY_CHAT_IDS }}
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: make notify-deploy-failure

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
