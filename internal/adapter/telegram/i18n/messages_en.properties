rules.text=<b>Rules</b>\n\n<b>Points for an exact score:</b>\nBO1 — 1 · BO2 — 2 · BO3 — 2 · BO5 — 3\nOther series award the number of maps needed to win; fixed series award their length.\n\n<b>A correct outcome without an exact score</b> earns 1 point.\n\nCancelled matches and forfeits do not count. Votes can be changed until the match starts.
menu.help=❓ Help
help.text=<b>❓ Command reference</b>\n\nMost of the bot is controlled through buttons in its menus — commands mainly matter for quick access and for appointing moderators.\n\n<b>Commands in a group</b>\n/menu — open the bot menu\n/stats — this group's leaderboard\n/events &lt;query&gt; — add or search for a tournament (admins/moderators, opens a DM)\n/timezone &lt;zone&gt; — change the group's timezone (admins/moderators, opens a DM)\n/topic — bind the current forum topic to predictions\n/topics — manage per-tournament topic bindings\n/moderator add — reply to a member's message to appoint them a moderator with full access (Telegram admins only; grant narrower rights from DM's "👥 Moderators" instead)\n/moderator remove — reply to a member's message to remove their moderator rights\n/help — this reference\n\n<b>Commands in a private chat with the bot</b>\n/start — your personal statistics dashboard, or follows a link (group management, a moderator invitation, etc.)\n/menu, /stats — personal statistics dashboard\n/events &lt;query&gt; — search and add tournaments for the open group panel\n/timezone &lt;zone&gt; — change the open group's timezone\n/help — this reference
