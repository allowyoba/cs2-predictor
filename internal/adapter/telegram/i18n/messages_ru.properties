rules.text=<b>Правила</b>\n\n<b>Очки за точный счёт:</b>\nBO1 — 1 · BO2 — 2 · BO3 — 2 · BO5 — 3\nДля других серий — число карт, необходимое для победы; в фиксированной серии — её длина.\n\n<b>Верный исход без точного счёта</b> — 1 балл.\n\nОтменённые матчи и технические победы не учитываются. Голос можно изменить до начала матча.
menu.help=❓ Справка
help.text=<b>❓ Справка по командам</b>\n\nБольшая часть управления ботом происходит через кнопки в меню — команды нужны в первую очередь для быстрого доступа и назначения модераторов.\n\n<b>Команды в группе</b>\n/menu — открыть меню бота\n/stats — таблица лидеров группы\n/events &lt;запрос&gt; — добавить или найти турнир (для админов/модераторов, откроет ЛС)\n/timezone &lt;часовой пояс&gt; — сменить часовой пояс группы (для админов/модераторов, откроет ЛС)\n/topic — привязать текущую тему форума к прогнозам\n/topics — управление привязками тем турниров\n/moderator add — ответом на сообщение участника: назначить его модератором с полным доступом (только для администраторов Telegram; выдать отдельные права можно в ЛС через «👥 Модераторы»)\n/moderator remove — ответом на сообщение участника: снять права модератора\n/help — эта справка\n\n<b>Команды в личных сообщениях с ботом</b>\n/start — личный кабинет статистики, либо переход по ссылке (управление группой, приглашение модератора и т.д.)\n/menu, /stats — личный кабинет статистики\n/events &lt;запрос&gt; — поиск и добавление турниров для открытой панели управления группой\n/timezone &lt;часовой пояс&gt; — смена часового пояса открытой группы\n/help — эта справка
